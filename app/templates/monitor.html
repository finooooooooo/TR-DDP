<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Monitor</title>
    <style>
        body { font-family: sans-serif; background: #222; color: white; padding: 2rem; }
        h1 { border-bottom: 2px solid #555; padding-bottom: 1rem; }
        .mode-select { margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }

        .ticket { background: white; color: black; border-radius: 8px; overflow: hidden; animation: slideIn 0.5s; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .ticket-header { background: #eab308; padding: 0.5rem 1rem; font-weight: bold; display: flex; justify-content: space-between; }
        .kitchen-mode .ticket-header { background: #ef4444; color: white; } /* Red for Kitchen */
        .bar-mode .ticket-header { background: #3b82f6; color: white; } /* Blue for Bar */

        .ticket-body { padding: 1rem; }
        .ticket-item { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 1.1rem; }
        .ticket-footer { padding: 0.5rem; text-align: center; background: #eee; cursor: pointer; font-weight: bold; }
        .ticket-footer:hover { background: #ddd; }
    </style>
</head>
<body>
    <div class="mode-select">
        <label>Select Display Mode: </label>
        <select id="viewMode" onchange="changeMode()">
            <option value="Kitchen">Kitchen (Foods)</option>
            <option value="Bar">Bar (Drinks)</option>
        </select>
    </div>

    <h1 id="title">Kitchen Display System</h1>
    <div id="tickets" class="grid"></div>

    <script>
        let socket;
        let mode = 'Kitchen';

        function changeMode() {
            mode = document.getElementById('viewMode').value;
            document.body.className = mode === 'Kitchen' ? 'kitchen-mode' : 'bar-mode';
            document.getElementById('title').textContent = mode + ' Display System';
            document.getElementById('tickets').innerHTML = ''; // Clear current tickets
            connectWebSocket();
        }

        function connectWebSocket() {
            if (socket) socket.close();

            // In a real deployed environment, use wss:// and proper host
            const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            const wsUrl = `${protocol}://${window.location.host}/ws/${mode.toLowerCase()}`;

            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                console.log("Connected to " + mode);
            };

            socket.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'NEW_ORDER') {
                    renderTicket(msg.data);
                }
            };

            socket.onclose = () => {
                console.log("Disconnected, retrying...");
                setTimeout(connectWebSocket, 3000);
            };
        }

        function renderTicket(transaction) {
            // Filter items based on mode
            const relevantItems = transaction.items.filter(item => {
                const isDrink = ['Coffee', 'Non-Coffee'].includes(item.category);
                const isFood = ['Snack', 'Foods'].includes(item.category);

                if (mode === 'Kitchen') return isFood;
                if (mode === 'Bar') return isDrink;
                return false;
            });

            if (relevantItems.length === 0) return;

            const div = document.createElement('div');
            div.className = 'ticket';
            div.innerHTML = `
                <div class="ticket-header">
                    <span>#${transaction.id}</span>
                    <span>${new Date(transaction.created_at).toLocaleTimeString()}</span>
                </div>
                <div class="ticket-body">
                    ${relevantItems.map(i => `
                        <div class="ticket-item">
                            <span>${i.product_name}</span>
                            <span>x${i.quantity}</span>
                        </div>
                    `).join('')}
                </div>
                <div class="ticket-footer" onclick="this.parentElement.remove()">
                    DONE
                </div>
            `;
            document.getElementById('tickets').appendChild(div);
        }

        // Init
        changeMode();
    </script>
</body>
</html>
